

;==========================================================


[colors]

; ..........................
; tokyo night theme 
[colors]
background = #1a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
alert = #f7768e
disabled = #565f89


[bar/bar1]

width = 100%

height = 24pt

radius = 6


; dpi = 96


background = ${colors.background}

foreground = ${colors.foreground}


line-size = 3pt


border-size = 4pt

border-color = #00000000


padding-left = 0

padding-right = 1


module-margin = 1


separator = |

separator-foreground = ${colors.disabled}


font-0 = monospace;2
font-1 = Font Awesome 6 Free:style=Solid;2


modules-left = xworkspaces 
modules-center = date

modules-right =  pulseaudio  memory cpu wlan eth battery powermenu


cursor-click = pointer

cursor-scroll = ns-resize


enable-ipc = true


; wm-restack = generic

; wm-restack = bspwm

; wm-restack = i3


; override-redirect = true


; This module is not active by default (to enable it, add it to one of the

; modules-* list above).

; Please note that only a single tray can exist at any time. If you launch

; multiple bars with this module, only a single one will show it, the others

; will produce a warning. Which bar gets the module is timing dependent and can

; be quite random.

; For more information, see the documentation page for this module:

; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[module/systray]

type = internal/tray


format-margin = 8pt

tray-spacing = 16pt


[module/xworkspaces]

type = internal/xworkspaces


label-active = %name%

label-active-background = ${colors.background-alt}

label-active-underline= ${colors.primary}

label-active-padding = 1


label-occupied = %name%

label-occupied-padding = 1


label-urgent = %name%

label-urgent-background = ${colors.alert}

label-urgent-padding = 1


label-empty = %name%

label-empty-foreground = ${colors.disabled}

label-empty-padding = 1


[module/xwindow]

type = internal/xwindow

label = %title:0:60:...%



[module/pulseaudio]

type = internal/pulseaudio


format-volume-prefix = " "

format-volume-prefix-foreground = ${colors.primary}

format-volume = <label-volume>


label-volume = %percentage%%


label-muted = muted

label-muted-foreground = ${colors.disabled}



[module/memory]

type = internal/memory

interval = 2

format-prefix = " "

format-prefix-foreground = ${colors.primary}

label = %percentage_used:2%%


[module/cpu]

type = internal/cpu

interval = 2

format-prefix = " "

format-prefix-foreground = ${colors.primary}

label = %percentage:2%%


[network-base]
type = internal/network
interval = 1
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#8abeb7} %{F#ffffff} ...

[module/wlan]
type = internal/network
interface-type = wireless
format-connected = <label-connected>
label-connected = %{A1:rofiWifiMenu:}%{F#8abeb7}%{F-} %essid%%{A}
click-left = rofiWifiMenu



[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]

type = internal/date

interval = 1


;date = %H:%M

date = %H:%M  %Y-%m-%d 

format-prefix =" "
label = %date%

label-foreground = ${colors.primary}


[module/battery]
type = internal/battery
format-prefix="" 

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 5

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5




[module/powermenu]
type = custom/script
exec = echo "" $(whoami)
format-prefix = ""
format-prefix-foreground = ${colors.primary}
click-left = rofi -show power-menu -modi power-menu:rofiPowerMenu





[settings]

screenchange-reload = true

pseudo-transparency = true


; vim:ft=dosini
