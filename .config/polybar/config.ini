
[colors]
background      = #1a1b26
background-alt  = #24283b
background-dark = #16161e
foreground      = #c0caf5
primary         = #7aa2f7
secondary       = #bb9af7
cyan            = #7dcfff
green           = #9ece6a
yellow          = #e0af68
orange          = #ff9e64
alert           = #f7768e
disabled        = #565f89


[bar/bar1]
width    = 97%
offset-x = 1.5%
height   = 34pt
radius   = 12.0

fixed-center = true
bottom = false

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size  = 0
padding-left  = 2
padding-right = 2

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10:weight=Bold;3"
font-1 = "JetBrainsMono Nerd Font:size=13;4"

modules-left   = i3
modules-center = date
modules-right  = pulseaudio memory cpu battery wlan systray powermenu

cursor-click  = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3


[module/systray]
type            = internal/tray
format-margin   = 4pt
tray-spacing    = 8pt
tray-background = ${colors.background}


[module/i3]
type            = internal/i3
format          = <label-state> <label-mode>
index-sort      = true
wrapping-scroll = false

label-mode            = %mode%
label-mode-padding    = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.orange}

label-focused            = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-underline  = ${colors.cyan}
label-focused-padding    = 3

label-unfocused            = %index%
label-unfocused-padding    = 3
label-unfocused-foreground = ${colors.disabled}

label-visible            = %index%
label-visible-background = ${colors.background-alt}
label-visible-underline  = ${colors.disabled}
label-visible-padding    = 3

label-urgent            = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding    = 3


[module/xwindow]
type             = internal/xwindow
label            = %title:0:48:...%
label-foreground = ${colors.disabled}


[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true

format-volume          = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.green}

ramp-volume-0 =
ramp-volume-1 =
ramp-volume-2 =
ramp-volume-foreground = ${colors.green}

label-volume = %percentage%%

label-muted            =  muted
label-muted-foreground = ${colors.disabled}

click-right = pavucontrol


[module/memory]
type     = internal/memory
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.secondary}
label                    = %percentage_used%%
label-foreground         = ${colors.foreground}


[module/cpu]
type     = internal/cpu
interval = 2

format-prefix            = " "
format-prefix-foreground = ${colors.cyan}
label                    = %percentage%%
label-foreground         = ${colors.foreground}


[module/wlan]
type           = internal/network
interface-type = wireless
interval       = 3

format-connected            = <label-connected>
format-connected-prefix     = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected             = %essid%

format-disconnected            = <label-disconnected>
format-disconnected-prefix     = " "
format-disconnected-prefix-foreground = ${colors.alert}
label-disconnected             = offline
label-disconnected-foreground  = ${colors.alert}

click-left = ~/dotFiles/rofiWifiMenu.sh


[module/battery]
type     = internal/battery
battery  = BAT0
adapter  = ADP1
full-at  = 99
low-at   = 20
poll-interval = 5

format-charging         = <animation-charging> <label-charging>
format-charging-foreground = ${colors.green}

format-discharging         = <ramp-capacity> <label-discharging>

format-full              = <label-full>
format-full-prefix       = " "
format-full-prefix-foreground = ${colors.green}
format-full-foreground   = ${colors.green}

label-charging   = %percentage%%
label-discharging = %percentage%%
label-full       = full

ramp-capacity-0            =
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1            =
ramp-capacity-1-foreground = ${colors.orange}
ramp-capacity-2            =
ramp-capacity-2-foreground = ${colors.yellow}
ramp-capacity-3            =
ramp-capacity-3-foreground = ${colors.green}
ramp-capacity-4            =
ramp-capacity-4-foreground = ${colors.green}

animation-charging-0            =
animation-charging-1            =
animation-charging-2            =
animation-charging-3            =
animation-charging-4            =
animation-charging-framerate    = 700
animation-charging-foreground   = ${colors.green}


[module/date]
type     = internal/date
interval = 1

date     = %H:%M
date-alt = %H:%M   %a %d %b

format-prefix            = " "
format-prefix-foreground = ${colors.primary}
label                    = %date%
label-foreground         = ${colors.foreground}

click-left = polybar-msg action date hook 0


[module/powermenu]
type              = custom/text
format            = " "
format-foreground = ${colors.alert}
click-left        = rofi -show power-menu -modi "power-menu:~/dotFiles/rofiPowerMenu.sh"


[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
